<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3</title>

    <style>
        :root {
            --ink: #14121f;
            --bg: #f3f3fa;
            --yellow: #ffe066;
            --lilac: #cdbdff;
            --mint: #b5f0d0;
            --pink: #ffb8cd;
            --sky: #aed6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Trebuchet MS", Verdana, sans-serif;
            color: var(--ink);
            background-color: var(--bg);
            background-image: radial-gradient(#c9c9de 1.5px, transparent 1.5px);
            background-size: 22px 22px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        header {
            padding: 72px 0 48px;
        }

        h1 {
            margin: 0;
            max-width: 14em;
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
            font-weight: 900;
            font-size: clamp(32px, 7vw, 60px);
            line-height: 1.05;
            overflow-wrap: anywhere;
        }

        .week-container {
            list-style: none;
            margin: 0;
            padding: 0 0 8px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .card a {
            display: block;
            padding: 34px 24px;
            color: var(--ink);
            text-decoration: none;
            font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif;
            font-size: 28px;
            line-height: 1.1;
            border: 3px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            transition: transform 0.12s, box-shadow 0.12s;
        }

        .card:nth-child(5n+1) a { background: var(--lilac); }
        .card:nth-child(5n+2) a { background: var(--mint); }
        .card:nth-child(5n+3) a { background: var(--pink); }
        .card:nth-child(5n+4) a { background: var(--sky); }
        .card:nth-child(5n+5) a { background: var(--yellow); }

        .card a:hover {
            transform: translate(-3px, -3px);
            box-shadow: 9px 9px 0 var(--ink);
        }

        .card a:focus-visible {
            outline: 4px solid var(--ink);
            outline-offset: 4px;
        }

        footer {
            margin-top: 48px;
            padding: 20px 0 32px;
            border-top: 3px solid var(--ink);
            font-size: 14px;
        }

        @media (max-width: 760px) {
            header {
                padding: 48px 0 32px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card a {
                transition: none;
            }

            .card a:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>These are assignments for Week 3</h1>
        </header>

        <main>
            <ul class="week-container">
                <li class="card"><a href="./Week3-1.html">Week 3-1</a></li>
                <li class="card"><a href="Week3-2.html">Week 3-2</a></li>
            </ul>
        </main>

        <footer>Abdulazizbek &middot; ID 202537225 &middot; Computer Engineering</footer>
    </div>
</body>
</html>
