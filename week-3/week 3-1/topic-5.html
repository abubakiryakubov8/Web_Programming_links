<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* ID selector — targets the ONE element with id="main-title" */
    #heading {
      color: aquamarine;
      font-size: 25px;
      border: 1px solid black ;
      border-radius: 10px;
      padding: 15px;
    }

    #container {
      background: #f00;
      padding: 40px;
      color: white;
      border: 1px solid yellow;
      border-radius: 12px;
    }
  </style>
  <title>Topic-5</title>
</head>
<body>
  <div id="container">
    <h1 id="heading">This is aquamarine heading which has border with 10px raidus</h1>
    <p>Above heading is styled with id selector</p>
  </div>
</body>
</html>
