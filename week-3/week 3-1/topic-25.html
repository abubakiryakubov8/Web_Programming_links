<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic 25</title>
  <style>
    body{
      font-family: sans-serif;
    }
    .card{
        /* display: flex;
        flex-direction: column;
        columns: 1; */
        margin: 15% auto;
        justify-content: center;
        align-items: center; 
        border-radius: 10px;
        background: #befaa6;
        padding: 10px knbnkmm l30px;
        gap: 20px;
        width: 40%;
    }
    .avatar-cont{
      display: flex;
      gap: 30px;
      justify-content: flex-start;
      align-items: center;
    }
    .block{
      display: block;
      /* gap: 5px; */
    }
    h1{
      color: coral;
      font-size: 25px;
    }
    span{
      color: grey;
      text-transform: capitalize;
    }
    .description{
      font-size: 13px;
      font-weight: lighter;
    }
    li{
      background: coral;
      border-radius: 15px;
      padding: 4px 15px;
      list-style: none;
      width: 70%;
      text-align: center;
    }
    .list-cont{
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      justify-content: flex-start;
      align-items: center;
      gap: 10px;
      /* background: #000; */
    }
    img{
      width: 15%;
      height: 15%;
      border-radius: 50%;
    }
    .btn-cont{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }
    .btn{
      padding: 10px 20px;
      border-radius: 20px;
      background: coral;
      text-align: center;
      cursor: pointer;
      border: none;
    }
    h3{
      visibility: hidden;
    }
    @media (min-width: 768px) {
      .list-cont{
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      li{
        width: 70%;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar-cont">
      <img src="./avatar.jpg" alt="Avatar">
      <div class="block">
        <h1>Abdulazizbek</h1>
        <span>Web programming student & Gachon University</span>
      </div>
    </div>
    <div class="description">
      <h2>Hello! I am revicing HTML and CSS in week 3. This is one of my projects showing mastery over html and css</h2>
    </div>
    <div>
      <div class="list-cont">
        <li>HTML5</li>
        <li>CSS3</li>
        <li>JavaScript</li>
        <li>React</li>
      </div>
      <div class="btn-cont">
        <button onclick="document.getElementById('hdn').style.visibility = document.getElementById('hdn').style.visibility === 'hidden' ? 'visible' : 'hidden' " class="btn">See More</button>
        <h3 id="hdn">That was all to see ;)</h3>
      </div>
    </div>
  </div>
</body>
</html>
