<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 23</title>
    <style>
        p{
            color: black;
            font-size: 20px;
        }
        .aqua{
            color: aqua;   
        }
        .aqua p{
            color: blue;
        }
        #magenta{
            color: magenta;
        }
        #magenta p{
            color: brown;
        }
    </style>
</head>
<body>
    <p>Just a black text with no selectors</p>
    <p class="aqua">An aqua text with a class selector winning over tag selector</p>
    <p id="magenta" class="aqua">Magenta winning over all because of id selector</p>
</body>
</html>
