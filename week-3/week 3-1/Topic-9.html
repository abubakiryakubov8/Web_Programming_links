<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    .banner {
      background-color: #00f;
      color: white;
      padding: 20px 30px;
      border-radius: 8px;
    }

    .warning {
      background-color: #000;   /* amber-50 */
      color: #fff;              /* amber-800 */
      padding: 12px 16px;
      border-left: 4px solid #f59e0b;
    }

    .dark-card {
      background-color: cyan;
      color: #000;
      padding: 20px;
    }
  </style>
  <title>topic 9</title>
</head>
<body>
  <div class="banner">blue banner with white text (high contrast)</div>
  <br>
  <div class="warning">⚠ Warning box with dark background</div>
  <br>
  <div class="dark-card">light card with dark text</div>
</body>
</html>
