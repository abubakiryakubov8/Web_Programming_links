
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>exercise 3</title>

  <style>
    .swatch-container {
      display: flex;
      flex-direction: row;
      gap: 12px;
    }

    .swatch {
      flex: 1;
      padding: 30px 15px;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      text-align: center;
    }

    .colour-1 { background-color: #15803d; }
    .colour-2 { background-color: #2563eb; }
    .colour-3 { background-color: #dc2626; }
    .colour-4 { background-color: #9333ea; }
    .colour-5 { background-color: #ea580c; }
  </style>
</head>

<body>

  <div class="swatch-container">
    <div class="swatch colour-1">#15803d</div>
    <div class="swatch colour-2">#2563eb</div>
    <div class="swatch colour-3">#dc2626</div>
    <div class="swatch colour-4">#9333ea</div>
    <div class="swatch colour-5">#ea580c</div>
  </div>

</body>
</html>
