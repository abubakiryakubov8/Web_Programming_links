<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic-21</title>
    <style>
        div{
            margin-top: 20px;
        }
        .flex{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .card{
            padding: 30px;
            border: 3px solid deeppink;
            border-radius: 10px;
        }
        .between{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .evenly{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="flex">
        <div class="card">This is content and align center</div>
        <div class="card">This is content and align center</div>
        <div class="card">This is content and align center</div>
        <div class="card">This is content and align center</div>
    </div>
    <div class="between">
        <div class="card">This is justify between align center</div>
        <div class="card">This is justify between align center</div>
    </div>
    <div class="evenly">
        <div class="card">This is justify evenly align center</div>
        <div class="card">This is justify evenly align center</div>
    </div>

</body>
</html>
