<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    /* Type selectors — apply to every element of that type */
    h1 { color: #00f; }
    h2 { color: #f00; font-size: 1.4rem; }
    p  { font-size: 10px; line-height: 1.7; color: grey; }
    a  { color: greenyellow; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Combination: only <p> with class="lead" */
    p.lead { font-size: 1.2rem; font-weight: 500; }
  </style>
  <title>topic 7</title>
</head>
<body>
  <h1>Main Heading is blue</h1>
  <h2>Sub Heading is red</h2>
  <p class="lead">Lead paragraph (smaller).</p>
  <p>This is<a href="#">A link.</a></p>
</body>
</html>
