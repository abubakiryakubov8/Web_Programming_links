<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .card {
      border: 1px solid #000;
      border-radius: 8px;
      padding: 17px;
      margin: 10px;
    }

    .featured {          
      border-color: cyan;
      background: grey;
    }

    .large { font-size: 40px }
    .parent{
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }
  </style>
  <title>Topic 6</title>
</head>
<body>
  <div class="parent">
    <div class="card">Just a card</div>
    <div class="card featured">Styled card (with two classes)</div>
    <div class="card featured large">Featured + large (with three classes)</div>
  </div>
</body>
</html>
