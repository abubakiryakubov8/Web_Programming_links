<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topic 15</title>
    <style>
        .left{
            text-align: left;
        }
        .right{
            text-align: right;
        }
        .center{
            text-align: center;
        }
        .justify{
            text-align: justify;
        }
        .box{
            margin: 0 auto;
            text-align: center;
        }
        div{
            border: 1px solid aqua;
            padding: 30px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="left">This is text aligned left</div>
    <div class="right">This is text aligned right</div>
    <div class="center">This is text aligned center</div>
    <div class="justify">This is text justified to touch bot ends </div>
    <div class="box">This is a box in the center using margin 0 auto</div>
</body>
</html>
