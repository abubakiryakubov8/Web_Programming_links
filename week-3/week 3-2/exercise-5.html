<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; }

  /* TODO: .nav — position fixed, top 0, full width, dark background, flex, padding */
  .nav {
    display: flex;
    justify-content: space-between;
    padding: 10px 30px;
    position: fixed;
    top: 0;
    width: 100%;
    background: #000;
    color: white;
   }

  /* TODO: .nav-logo — white, bold, no underline */
  .nav-logo {
    font-weight: bold;
    text-decoration: none;
   }

  /* TODO: .nav-links — flex, gap */
  .nav-links {
    display: flex;
    gap: 10px;
   }

  /* TODO: .nav-links a — light grey, no underline */
  .nav-links a { 
    color: lightgray;
    text-decoration: none;
    transition: all .3s linear;
  }

  /* TODO: hover — teal #14b8a6 */
  .nav-links a:hover { 
    color: #14b8a6;
  }

  /* Content to scroll */
  .content { padding-top: 70px; }
  .section  { height: 300px; padding: 40px; font-size: 18px; }
</style>
</head>
<body>
  <nav class="nav">
    <a href="#" class="nav-logo">WebPro</a>
    <div class="nav-links">
      <a href="#s1">Home</a>
      <a href="#s2">Topics</a>
      <a href="#s3">Quiz</a>
    </div>
  </nav>
  <div class="content">
    <div class="section" id="s1" style="background:#f0fdfa">Section 1 — scroll down…</div>
    <div class="section" id="s2" style="background:#ccfbf1">Section 2 — nav stays fixed!</div>
    <div class="section" id="s3" style="background:#99f6e4">Section 3</div>
  </div>
</body>
</html>
