<!DOCTYPE html>
<html>
<head>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background: #fecece;
    font-family: sans-serif;
  }

  .card {
    position: relative;
    width: 280px;
    height: 180px;
    background: #ffffff;
    border: 2px solid teal;
    border-radius: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }

  .badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: teal;
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }
</style>
<title>Exercise 1</title>
</head>
<body>

  <div class="card">
    <span class="badge">SALE</span>
  </div>

</body>
</html>
