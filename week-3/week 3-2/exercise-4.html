<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8">
<style>
  :root {
    --primary: #0f766e;
    --accent: #14b8a6;
    --bg: #f0fdfa;
    --text: #134e4a;
    --radius: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #2dd4bf;
      --accent: #5eead4;
      --bg: #0f172a;
      --text: #e2e8f0;
    }
  }

  body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }

  .btn {
    background: var(--primary);
    color: white; border: none; padding: 10px 20px; cursor: pointer;
    border-radius: var(--radius);
  }
  .card {
    background: var(--bg);
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    padding: 20px; margin-top: 16px;
  }
</style>
<title>exercise 4</title>
</head>
<body>
  <button class="btn">Click Me</button>
  <div class="card">A themed card using CSS variables</div>
</body>
</html>
