
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: beige;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .counter-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 340px;
    }

    h1 {
      color: #23448c;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
    }

    #count {
      display: block;
      font-size: 64px;
      font-weight: bold;
      color: aqua;
      margin: 25px 0;
    }

    button {
      padding:12px 18px;
      margin: 2px;
      border: none;
      border-radius: 8px;
      background: green;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #fff;
      transform: translateY(-2px);
      color: #000;
      border: 1px dashed black;
    }

    .reset {
      background: #dc3545;
    }

    .reset:hover {
      background: #fff;
      color: #000;
      border: 1px dashed black;
    }
  </style>
</head>

<body>

  <div class="counter-card">
    <h1>Counter</h1>

    <p>Current Count:</p>
    <span id="count">0</span>

    <button onclick="change(1)">+</button>
    <button onclick="change(-1)">−</button>
    
    <button class="reset" onclick="reset()">Reset</button>
  </div>

  <script>
    let count = 0;

    function change(amount) {
      count = count + amount;

      document.getElementById('count').textContent = count;
    }

    function reset() {
      count = 0;

      document.getElementById('count').textContent = count;
    }
  </script>

</body>
</html>
