<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign-in form</title><link rel="stylesheet" href="style.css"></head>
<body><main class="wrap">
<h1>Sign in</h1>
<p class="lead">Exercise 1. A demo form: nothing is sent anywhere.</p>
<form id="f">
  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="email" required>
  <label for="pw">Password</label>
  <div class="row"><input type="password" id="pw" name="password" autocomplete="current-password" required>
  <button type="button" class="ghost" id="show" aria-pressed="false">Show</button></div>
  <p class="err" id="caps" role="status"></p>
  <label><input type="checkbox" id="remember"> Remember my email on this device</label>
  <button type="submit">Sign in</button>
  <p class="msg" id="ok" role="status" hidden></p>
</form>
<p><a href="index.html">Back to Week 8</a></p>
<footer>Abdulazizbek &middot; ID 202537225</footer>
</main>
<script>
const $=id=>document.getElementById(id), pw=$('pw'), email=$('email');
try{const s=localStorage.getItem('email');if(s){email.value=s;$('remember').checked=true}}catch(e){}
$('show').onclick=function(){const h=pw.type==='password';pw.type=h?'text':'password';this.textContent=h?'Hide':'Show';this.setAttribute('aria-pressed',h)};
pw.addEventListener('keyup',e=>{$('caps').textContent=e.getModifierState&&e.getModifierState('CapsLock')?'Caps Lock is on.':''});
$('f').addEventListener('submit',e=>{e.preventDefault();
  try{$('remember').checked?localStorage.setItem('email',email.value):localStorage.removeItem('email')}catch(x){}
  const o=$('ok');o.textContent='Signed in as '+email.value+' (demo only).';o.hidden=false});
</script></body></html>
