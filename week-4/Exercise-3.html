<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Week 4, Exercise-3</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    padding: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #eef0e8;
    color: #1f2a22;
    font-family: Georgia, "Times New Roman", serif;
  }

  .app {
    width: 100%;
    max-width: 440px;
    margin-top: 6vh;
    background: #fbfcf8;
    border: 1px solid #d5dacb;
    border-radius: 16px;
    padding: 24px;
  }

  h1 { margin: 0 0 18px; font-size: 26px; font-weight: 600; }

  .add { display: flex; gap: 8px; margin-bottom: 18px; }

  input {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 16px;
    padding: 10px 12px;
    color: #1f2a22;
    background: transparent;
    border: 1px solid #d5dacb;
    border-radius: 10px;
  }

  input:focus-visible,
  button:focus-visible { outline: 3px solid #2d6a4f; outline-offset: 2px; }

  #add-btn {
    font: inherit;
    font-size: 15px;
    cursor: pointer;
    padding: 10px 18px;
    border: 0;
    border-radius: 10px;
    background: #2d6a4f;
    color: #fbfcf8;
  }

  ul { list-style: none; margin: 0; padding: 0; }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid #d5dacb;
    overflow-wrap: anywhere;
  }

  .delete {
    flex: none;
    font: inherit;
    cursor: pointer;
    line-height: 1;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: transparent;
    color: #667468;
    border: 1px solid transparent;
  }

  .delete:hover { color: #a43a2f; border-color: #a43a2f; }

  .empty { margin: 8px 0 0; color: #667468; font-size: 15px; }
  .empty[hidden] { display: none; }
</style>
</head>
<body>

<main class="app">
  <h1>To-do list</h1>

  <div class="add">
    <input id="task-input" type="text" placeholder="What needs doing?" aria-label="New task" autocomplete="off">
    <button id="add-btn" type="button">Add</button>
  </div>

  <ul id="task-list"></ul>
  <p class="empty" id="empty">No tasks yet. Type one above and press Enter.</p>
</main>

<script>
  const input = document.querySelector('#task-input');
  const addBtn = document.querySelector('#add-btn');
  const list = document.querySelector('#task-list');
  const empty = document.querySelector('#empty');

  function updateEmpty() {
    empty.hidden = list.children.length > 0;
  }

  function addTask() {
    const text = input.value.trim();
    if (!text) return;

    // Build the item with createElement
    const li = document.createElement('li');

    const span = document.createElement('span');
    span.textContent = text;

    const del = document.createElement('button');
    del.className = 'delete';
    del.type = 'button';
    del.textContent = '✕';
    del.setAttribute('aria-label', 'Delete task: ' + text);

    li.append(span, del);
    list.appendChild(li);

    input.value = '';   // clear the input
    input.focus();
    updateEmpty();
  }

  // Add on button click
  addBtn.addEventListener('click', addTask);

  // Add on Enter
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  // Event delegation: one listener on the list handles every delete button
  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.delete');
    if (!btn) return;
    btn.closest('li').remove();
    updateEmpty();
  });
</script>

</body>
</html>
