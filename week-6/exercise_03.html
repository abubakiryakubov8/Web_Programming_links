<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Seoul Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #2f6fcb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--sky);
        color: #fff;
        font:
          400 16px/1.5 Manrope,
          system-ui,
          sans-serif;
        transition: background 0.8s;
      }
      header {
        padding: 28px clamp(20px, 6vw, 64px) 0;
      }
      header h1 {
        font-weight: 600;
        font-size: 1rem;
        margin: 0;
        opacity: 0.85;
      }
      header p {
        margin: 2px 0 0;
        font-size: 0.82rem;
        opacity: 0.65;
      }
      #view {
        padding: 0 clamp(20px, 6vw, 64px);
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .city {
        font-size: 1.6rem;
        font-weight: 600;
        margin: 0;
      }
      .temp {
        font-size: clamp(6rem, 24vw, 13rem);
        font-weight: 200;
        line-height: 1;
        margin: 0;
        letter-spacing: -0.04em;
      }
      .cond {
        font-size: 1.5rem;
        margin: 0 0 28px;
      }
      dl {
        display: flex;
        gap: 36px;
        flex-wrap: wrap;
        margin: 0;
      }
      dt {
        font-size: 0.8rem;
        opacity: 0.7;
      }
      dd {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 20px clamp(20px, 6vw, 64px) 28px;
        background: rgba(0, 0, 0, 0.18);
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: transparent;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        border-radius: 999px;
        padding: 8px 18px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: #fff;
        color: #16324f;
        border-color: #fff;
      }
      button.refresh {
        margin-left: auto;
        border-style: dashed;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Weather Now</h1>
      <p>Live data from Open-Meteo, no API key needed.</p>
    </header>
    <section id="view" aria-live="polite">Loading…</section>
    <nav id="nav"></nav>
    <script>
      const CITIES = {
        Seoul: [37.5665, 126.978],
        Busan: [35.1796, 129.0756],
        Incheon: [37.4563, 126.7052],
        Jeju: [33.4996, 126.5312],
        Singapore: [1.3521, 103.8198],
        Tokyo: [35.6762, 139.6503],
      };
      const CODES = [
        [[0], "Clear sky", "clear"],
        [[1], "Mainly clear", "clear"],
        [[2], "Partly cloudy", "cloud"],
        [[3], "Overcast", "cloud"],
        [[45, 48], "Fog", "cloud"],
        [[51, 53, 55, 56, 57], "Drizzle", "rain"],
        [[61, 63, 65, 66, 67, 80, 81, 82], "Rain", "rain"],
        [[71, 73, 75, 77, 85, 86], "Snow", "snow"],
        [[95, 96, 99], "Thunderstorm", "storm"],
      ];
      const SKY = {
        clear: "#2f6fcb",
        night: "#141c3a",
        cloud: "#5f6f80",
        rain: "#34495e",
        snow: "#7b93ad",
        storm: "#2a2340",
      };
      const $ = (id) => document.getElementById(id);
      let city = "Seoul";

      Object.keys(CITIES).forEach((n) => {
        const b = document.createElement("button");
        b.textContent = n;
        b.dataset.city = n;
        b.onclick = () => {
          city = n;
          load();
        };
        $("nav").appendChild(b);
      });
      const rf = document.createElement("button");
      rf.textContent = "Refresh";
      rf.className = "refresh";
      rf.onclick = () => load();
      $("nav").appendChild(rf);

      async function load() {
        document
          .querySelectorAll("nav button[data-city]")
          .forEach((b) =>
            b.setAttribute("aria-pressed", b.dataset.city === city),
          );
        $("view").textContent = "Loading " + city + "…";
        const [lat, lon] = CITIES[city];
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code,is_day`;
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const c = (await r.json()).current;
          const hit = CODES.find((x) => x[0].includes(c.weather_code)) || [
            0,
            "Unknown",
            "cloud",
          ];
          const theme = !c.is_day && hit[2] === "clear" ? "night" : hit[2];
          document.body.style.setProperty("--sky", SKY[theme]);
          $("view").innerHTML =
            `<h2 class="city">${city}</h2><p class="temp">${Math.round(c.temperature_2m)}°</p>
      <p class="cond">${hit[1]}${c.is_day ? "" : ", night"}</p>
      <dl><div><dt>Feels like</dt><dd>${Math.round(c.apparent_temperature)}°C</dd></div>
      <div><dt>Humidity</dt><dd>${c.relative_humidity_2m}%</dd></div>
      <div><dt>Wind</dt><dd>${c.wind_speed_10m} km/h</dd></div></dl>`;
        } catch (e) {
          $("view").textContent =
            "Could not load weather for " +
            city +
            " (" +
            e.message +
            "). Try Refresh.";
        }
      }
      load();
    </script>
  </body>
</html>
