<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Random Joke Fetcher</title>
    <style>
      :root {
        --bg: #cdbdff;
        --ink: #1a1233;
        --pink: #ff6fb1;
        --yel: #ffe14d;
        --mint: #7be0b5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.5 "Trebuchet MS",
          system-ui,
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2.5rem;
        line-height: 1.1;
        margin: 0 0 6px;
        text-shadow: 3px 3px 0 var(--yel);
      }
      h2 {
        font-size: 1.3rem;
        margin: 36px 0 12px;
      }
      .box {
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 8px;
        box-shadow: 6px 6px 0 var(--ink);
        padding: 22px;
      }
      #setup {
        font-size: 1.35rem;
        font-weight: 700;
        margin: 0 0 10px;
      }
      #punch {
        margin: 0;
        font-size: 1.2rem;
        background: var(--yel);
        display: inline-block;
        padding: 2px 8px;
      }
      #status {
        margin: 0;
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      button {
        font: inherit;
        font-weight: 700;
        color: var(--ink);
        background: var(--pink);
        border: 3px solid var(--ink);
        border-radius: 8px;
        padding: 10px 18px;
        box-shadow: 4px 4px 0 var(--ink);
        cursor: pointer;
      }
      button.alt {
        background: var(--mint);
      }
      button:active:not(:disabled) {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }
      li {
        background: #fff;
        border: 3px solid var(--ink);
        border-radius: 8px;
        padding: 12px 14px;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        align-items: flex-start;
      }
      li small {
        display: block;
        margin-top: 2px;
      }
      li button {
        padding: 4px 10px;
        box-shadow: 2px 2px 0 var(--ink);
        font-size: 0.85rem;
        background: #fff;
      }
      .err {
        color: #b00020;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Random Joke Fetcher</h1>
      <p>
        Pull a fresh joke from the internet and keep the ones that made you
        groan.
      </p>
      <section class="box" aria-live="polite">
        <p id="status">Press "Load Joke" to get a joke.</p>
        <p id="setup" hidden></p>
        <p id="punch" hidden></p>
        <div class="row">
          <button id="load">Load Joke</button>
          <button id="save" class="alt" disabled>Save Favourite</button>
        </div>
      </section>
      <h2>Favourite jokes</h2>
      <ul id="favs"></ul>
      <p id="none">No favourites saved yet.</p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let current = null,
        favs = [];
      try {
        favs = JSON.parse(localStorage.getItem("jokeFavs") || "[]");
      } catch (e) {}

      async function getJoke() {
        try {
          const r = await fetch(
            "https://official-joke-api.appspot.com/random_joke",
          );
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          return { setup: d.setup, punchline: d.punchline };
        } catch (e) {
          const r = await fetch(
            "https://v2.jokeapi.dev/joke/Programming?safe-mode",
          );
          if (!r.ok) throw new Error("HTTP " + r.status);
          const d = await r.json();
          if (d.error) throw new Error(d.message || "API error");
          return d.type === "single"
            ? { setup: d.joke, punchline: "" }
            : { setup: d.setup, punchline: d.delivery };
        }
      }

      async function load() {
        $("load").disabled = true;
        $("save").disabled = true;
        $("status").className = "";
        $("status").textContent = "Loading…";
        $("status").hidden = false;
        try {
          current = await getJoke();
          $("setup").textContent = current.setup;
          $("punch").textContent = current.punchline;
          $("setup").hidden = false;
          $("punch").hidden = !current.punchline;
          $("status").hidden = true;
          $("save").disabled = false;
        } catch (e) {
          $("setup").hidden = $("punch").hidden = true;
          $("status").className = "err";
          $("status").textContent =
            "Could not load a joke (" +
            e.message +
            "). Check your connection and try again.";
        }
        $("load").disabled = false;
      }

      function renderFavs() {
        $("favs").innerHTML = "";
        $("none").hidden = favs.length > 0;
        favs.forEach((j, i) => {
          const li = document.createElement("li");
          const t = document.createElement("div");
          t.textContent = j.setup;
          if (j.punchline) {
            const s = document.createElement("small");
            s.textContent = j.punchline;
            t.appendChild(s);
          }
          const b = document.createElement("button");
          b.textContent = "Remove";
          b.onclick = () => {
            favs.splice(i, 1);
            persist();
          };
          li.append(t, b);
          $("favs").appendChild(li);
        });
      }
      function persist() {
        try {
          localStorage.setItem("jokeFavs", JSON.stringify(favs));
        } catch (e) {}
        renderFavs();
      }

      $("load").onclick = load;
      $("save").onclick = () => {
        if (!current) return;
        if (
          !favs.some(
            (f) =>
              f.setup === current.setup && f.punchline === current.punchline,
          )
        )
          favs.push(current);
        persist();
      };
      renderFavs();
    </script>
  </body>
</html>
