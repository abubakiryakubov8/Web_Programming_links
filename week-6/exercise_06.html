<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Country Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef2f7;
        --ink: #14213d;
        --mute: #5b6a82;
        --line: #d5dce7;
        --blue: #2457c5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.5 "IBM Plex Sans",
          system-ui,
          sans-serif;
        padding: 28px clamp(12px, 4vw, 48px);
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      .sub {
        color: var(--mute);
        max-width: 70ch;
        margin: 6px 0 18px;
        font-size: 0.88rem;
      }
      form {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: end;
        margin-bottom: 12px;
      }
      label {
        display: grid;
        gap: 3px;
        font-size: 0.82rem;
        font-weight: 500;
      }
      input,
      select {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        min-width: 190px;
      }
      button.go {
        font: inherit;
        font-weight: 600;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 9px 20px;
        cursor: pointer;
      }
      input:focus-visible,
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      #count {
        color: var(--mute);
        font-size: 0.85rem;
        margin: 0 0 8px;
      }
      .scroll {
        overflow: auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        max-height: 72vh;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 720px;
      }
      th,
      td {
        padding: 8px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: #f7f9fc;
        font-weight: 600;
        font-size: 0.85rem;
      }
      th button {
        all: unset;
        cursor: pointer;
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      th button:focus-visible {
        outline: 2px solid var(--blue);
      }
      th .ar {
        color: var(--blue);
        width: 1em;
      }
      td.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      th.n {
        text-align: right;
      }
      th.n button {
        justify-content: flex-end;
      }
      tbody tr:hover {
        background: #f2f6fd;
      }
      td img {
        width: 32px;
        height: 22px;
        object-fit: cover;
        border: 1px solid var(--line);
        border-radius: 2px;
        display: block;
      }
      .empty {
        padding: 24px;
        color: var(--mute);
      }
    </style>
  </head>
  <body>
    <h1>Country Table</h1>
    <p class="sub">
      Country data comes from the world-countries dataset (via jsDelivr), flags
      from flagcdn.com and population from the World Bank API. Click a column
      heading to sort.
    </p>
    <form id="f">
      <label
        >Name<input
          id="name"
          placeholder="Country or capital"
          autocomplete="off"
      /></label>
      <label
        >Region<select id="region">
          <option value="">All regions</option>
        </select></label
      >
      <button class="go">Search</button>
    </form>
    <p id="count" aria-live="polite">Loading countries…</p>
    <div class="scroll">
      <table>
        <thead>
          <tr id="head"></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <script>
      const COLS = [
        ["flag", "Flag", 0],
        ["name", "Country", 0],
        ["capital", "Capital", 0],
        ["region", "Region", 0],
        ["pop", "Population", 1],
        ["area", "Area (km²)", 1],
      ];
      const COUNTRY_URLS = [
        "https://cdn.jsdelivr.net/npm/world-countries/countries.json",
        "https://cdn.jsdelivr.net/gh/mledoze/countries@master/countries.json",
        "https://raw.githubusercontent.com/mledoze/countries/master/countries.json",
      ];
      const POP_URLS = [
        "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=400&mrnev=1",
        "https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=400&date=2022",
      ];
      const $ = (id) => document.getElementById(id);
      let all = [],
        view = [],
        sort = { key: "name", dir: 1 },
        popError = "";
      const esc = (s) =>
        String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      COLS.forEach(([k, label, num]) => {
        const th = document.createElement("th");
        if (num) th.className = "n";
        if (k === "flag") th.textContent = label;
        else {
          th.innerHTML = `<button type="button">${label}<span class="ar"></span></button>`;
          th.firstChild.onclick = () => {
            sort = { key: k, dir: sort.key === k ? -sort.dir : 1 };
            draw();
          };
          th.dataset.k = k;
        }
        $("head").appendChild(th);
      });

      async function firstJson(urls) {
        let last;
        for (const u of urls) {
          try {
            const r = await fetch(u);
            if (!r.ok) throw new Error("HTTP " + r.status);
            return await r.json();
          } catch (e) {
            last = e;
          }
        }
        throw last || new Error("no source worked");
      }

      async function load() {
        let countries;
        try {
          countries = await firstJson(COUNTRY_URLS);
        } catch (e) {
          $("count").textContent =
            "Could not load country data (" +
            e.message +
            "). Check your internet connection and reload the page.";
          return;
        }

        const pick = (c, keys) => {
          for (const k of keys)
            if (typeof c[k] === "string" && c[k]) return c[k];
          return "";
        };
        all = countries
          .map((c) => {
            const name =
              typeof c.name === "string"
                ? c.name
                : (c.name && (c.name.common || c.name.official)) || "";
            const a2 = pick(c, [
              "cca2",
              "alpha2",
              "iso2",
              "iso3166-1-alpha-2",
              "alpha-2",
            ]).toUpperCase();
            const a3 = pick(c, [
              "cca3",
              "alpha3",
              "iso3",
              "iso3166-1-alpha-3",
              "alpha-3",
            ]).toUpperCase();
            return {
              a2,
              a3,
              name,
              official: (c.name && c.name.official) || "",
              capital:
                (Array.isArray(c.capital) ? c.capital[0] : c.capital) || "—",
              region: c.region || "Other",
              pop: null,
              area: typeof c.area === "number" ? c.area : null,
            };
          })
          .filter((c) => c.name);
        [...new Set(all.map((c) => c.region))]
          .sort()
          .forEach((r) => $("region").add(new Option(r, r)));
        filter(); // table is usable right away

        try {
          // population arrives later and never blocks the table
          const data = await firstJson(POP_URLS);
          const by3 = {},
            by2 = {};
          (data[1] || []).forEach((x) => {
            if (!x.value) return;
            if (x.countryiso3code) by3[x.countryiso3code] = x.value;
            if (x.country && x.country.id) by2[x.country.id] = x.value;
          });
          all.forEach((c) => {
            c.pop = by3[c.a3] ?? by2[c.a2] ?? null;
          });
          draw();
        } catch (e) {
          popError = e.message;
          draw();
        }
      }

      function flagFail(img) {
        const cc = img.dataset.cc,
          t = +img.dataset.try;
        const next = [
          `https://flagsapi.com/${cc}/flat/32.png`,
          `https://flagcdn.com/48x36/${cc.toLowerCase()}.png`,
        ];
        if (t < next.length) {
          img.dataset.try = t + 1;
          img.src = next[t];
        } else {
          const sp = document.createElement("span");
          sp.textContent = cc;
          img.replaceWith(sp);
        }
      }

      function filter() {
        const q = $("name").value.trim().toLowerCase(),
          r = $("region").value;
        view = all.filter(
          (c) =>
            (!r || c.region === r) &&
            (!q ||
              c.name.toLowerCase().includes(q) ||
              c.official.toLowerCase().includes(q) ||
              c.capital.toLowerCase().includes(q)),
        );
        draw();
      }

      function draw() {
        const { key, dir } = sort;
        view.sort((a, b) => {
          const x = a[key],
            y = b[key];
          if (x == null) return 1;
          if (y == null) return -1;
          return (
            (typeof x === "number"
              ? x - y
              : String(x).localeCompare(String(y))) * dir
          );
        });
        document.querySelectorAll("th[data-k]").forEach((th) => {
          th.querySelector(".ar").textContent =
            th.dataset.k === key ? (dir > 0 ? "▲" : "▼") : "";
          th.setAttribute(
            "aria-sort",
            th.dataset.k === key
              ? dir > 0
                ? "ascending"
                : "descending"
              : "none",
          );
        });
        $("count").textContent =
          `${view.length} of ${all.length} countries` +
          (popError
            ? ` (population unavailable: ${popError}. Open this file in a normal browser tab with internet access.)`
            : "");
        const f = (n) => (n == null ? "—" : Math.round(n).toLocaleString());
        $("rows").innerHTML = view.length
          ? view
              .map(
                (c) => `<tr>
    <td>${c.a2 ? `<img loading="lazy" src="https://flagcdn.com/w40/${c.a2.toLowerCase()}.png" data-cc="${c.a2}" data-try="0" onerror="flagFail(this)" alt="Flag of ${esc(c.name)}">` : "—"}</td>
    <td>${esc(c.name)}</td><td>${esc(c.capital)}</td><td>${esc(c.region)}</td>
    <td class="n">${f(c.pop)}</td><td class="n">${f(c.area)}</td></tr>`,
              )
              .join("")
          : '<tr><td colspan="6" class="empty">No countries match. Try a shorter name or another region.</td></tr>';
      }

      $("f").onsubmit = (e) => {
        e.preventDefault();
        filter();
      };
      $("name").addEventListener("input", filter);
      $("region").addEventListener("change", filter);
      load();
    </script>
  </body>
</html>
