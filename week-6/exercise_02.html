<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JSONPlaceholder Posts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #f6f8fa;
        --ink: #16222e;
        --mute: #5d6b78;
        --line: #d7dee5;
        --teal: #0f766e;
        --tealbg: #e0f2f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          16px/1.6 Inter,
          system-ui,
          sans-serif;
      }
      .wrap {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: 100vh;
      }
      aside {
        background: #fff;
        border-right: 1px solid var(--line);
        padding: 28px 20px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow: auto;
      }
      aside h1 {
        font:
          700 1.6rem/1.2 "Source Serif 4",
          Georgia,
          serif;
        margin: 0 0 6px;
      }
      aside p {
        color: var(--mute);
        font-size: 0.9rem;
        margin: 0 0 20px;
      }
      label {
        font-weight: 600;
        font-size: 0.9rem;
        display: block;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        font: inherit;
        padding: 9px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      select:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }
      #author {
        margin-top: 18px;
        font-size: 0.88rem;
        color: var(--mute);
      }
      #author b {
        color: var(--ink);
        display: block;
        font-size: 1rem;
      }
      main {
        padding: 32px clamp(16px, 5vw, 56px);
        max-width: 820px;
      }
      article {
        background: #fff;
        border: 1px solid var(--line);
        border-left: 4px solid var(--teal);
        border-radius: 6px;
        padding: 20px 22px;
        margin-bottom: 18px;
      }
      article h2 {
        font:
          600 1.3rem/1.3 "Source Serif 4",
          Georgia,
          serif;
        margin: 0 0 8px;
        text-transform: capitalize;
      }
      article p {
        margin: 0 0 12px;
        color: #33414e;
      }
      .tog {
        font: inherit;
        font-weight: 500;
        color: var(--teal);
        background: var(--tealbg);
        border: 0;
        border-radius: 999px;
        padding: 6px 14px;
        cursor: pointer;
      }
      .comments {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .c {
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
        font-size: 0.92rem;
      }
      .c:last-child {
        border: 0;
      }
      .c b {
        display: block;
        text-transform: capitalize;
      }
      .c span {
        color: var(--mute);
        font-size: 0.82rem;
      }
      .msg {
        color: var(--mute);
      }
      .err {
        color: #b00020;
      }
      @media (max-width: 720px) {
        .wrap {
          grid-template-columns: 1fr;
        }
        aside {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <aside>
        <h1>Blog Posts</h1>
        <p>
          Sample posts from jsonplaceholder.typicode.com. Pick an author, then
          open a post's comments.
        </p>
        <label for="users">Author</label>
        <select id="users" disabled>
          <option>Loading authors…</option>
        </select>
        <div id="author"></div>
      </aside>
      <main><div id="posts" class="msg">Loading…</div></main>
    </div>
    <script>
      const API = "https://jsonplaceholder.typicode.com";
      const $ = (id) => document.getElementById(id);
      let users = [];
      async function j(path) {
        const r = await fetch(API + path);
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      }
      function fail(el, e) {
        el.className = "err";
        el.textContent = "Something went wrong: " + e.message;
      }

      async function init() {
        try {
          users = await j("/users");
          $("users").innerHTML = users
            .map((u) => `<option value="${u.id}">${u.name}</option>`)
            .join("");
          $("users").disabled = false;
          showPosts(users[0].id);
        } catch (e) {
          fail($("posts"), e);
        }
      }
      async function showPosts(id) {
        const u = users.find((x) => x.id == id);
        $("author").innerHTML =
          `<b>${u.name}</b>@${u.username}<br>${u.email}<br>${u.company.name}`;
        $("posts").className = "msg";
        $("posts").textContent = "Loading posts…";
        try {
          const posts = await j("/posts?userId=" + id);
          $("posts").className = "";
          $("posts").innerHTML = "";
          posts.forEach((p) => {
            const a = document.createElement("article");
            a.innerHTML =
              '<h2></h2><p></p><button class="tog">Show comments</button><div class="comments" hidden></div>';
            a.querySelector("h2").textContent = p.title;
            a.querySelector("p").textContent = p.body;
            const btn = a.querySelector("button"),
              box = a.querySelector(".comments");
            let loaded = false;
            btn.onclick = async () => {
              if (loaded) {
                box.hidden = !box.hidden;
                btn.textContent = box.hidden
                  ? "Show comments"
                  : "Hide comments";
                return;
              }
              btn.disabled = true;
              btn.textContent = "Loading…";
              try {
                const cs = await j("/posts/" + p.id + "/comments");
                cs.forEach((c) => {
                  const d = document.createElement("div");
                  d.className = "c";
                  d.innerHTML = "<b></b><span></span><div></div>";
                  d.children[0].textContent = c.name;
                  d.children[1].textContent = c.email;
                  d.children[2].textContent = c.body;
                  box.appendChild(d);
                });
                loaded = true;
                box.hidden = false;
                btn.textContent = "Hide comments";
              } catch (e) {
                btn.textContent = "Retry comments";
              }
              btn.disabled = false;
            };
            $("posts").appendChild(a);
          });
        } catch (e) {
          fail($("posts"), e);
        }
      }
      $("users").onchange = (e) => showPosts(e.target.value);
      init();
    </script>
  </body>
</html>
